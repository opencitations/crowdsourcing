name: Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ZENODO: ${{ secrets.ZENODO }}
      ZENODO_SANDBOX: ${{ secrets.ZENODO_SANDBOX }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run coverage run -m unittest discover test/
          echo "=== Coverage Report ==="
          uv run coverage report
          echo "COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $4}')" >> $GITHUB_ENV

      - name: Generate HTML coverage report
        run: uv run coverage html -d htmlcov

      - name: Upload coverage report
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.ref_name }}
          path: htmlcov/
          retention-days: 14

      - name: Generate coverage badge
        if: matrix.python-version == '3.10'
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: opencitations-crowdsourcing-coverage
          label: "Coverage"
          status: ${{ env.COVERAGE }}
          color: green
          github_token: ${{ secrets.GIST_PAT }}
          repository: arcangelo7/badges
          actor: arcangelo7
