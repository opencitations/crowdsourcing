name: Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ZENODO: ${{ secrets.ZENODO }}
      ZENODO_SANDBOX: ${{ secrets.ZENODO_SANDBOX }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run coverage run -m unittest discover test/
          uv run coverage xml
          uv run coverage report

      - name: Generate HTML coverage report
        if: matrix.python-version == '3.12'
        run: uv run coverage html -d htmlcov

      - name: Generate coverage badge
        if: matrix.python-version == '3.12'
        run: uv run genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov

      - name: Upload coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.svg
