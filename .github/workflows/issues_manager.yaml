name: Issues manager
on:
  issues:
    types: [opened, edited]

# Ensure only one issue is processed at a time
concurrency:
  group: issue-processing
  cancel-in-progress: false

jobs:
  Process:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ZENODO_PRODUCTION: ${{ secrets.ZENODO_PRODUCTION }}
      ZENODO_SANDBOX: ${{ secrets.ZENODO_SANDBOX }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT || 'development' }}
    steps:
      - name: Validate issue title format
        run: |
          TITLE="${{ github.event.issue.title }}"
          if ! echo "$TITLE" | grep -qP '^deposit\s+\S+\s+[a-zA-Z]+:.+$'; then
            echo "Issue title does not match expected format: deposit {domain} {schema}:{identifier}"
            exit 0
          fi
          echo "Issue title format is valid"

      - name: List files in the repository
        uses: actions/checkout@v6

      - name: Configure Git
        run: |
          git config --global user.name "crocibot"
          git config --global user.email "contact@opencitations.net"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Process and validate the issue
        run: uv run python3 crowdsourcing/process_issues.py

      - name: Commit validation changes
        run: |
          git add docs/validation_reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update validation reports [skip ci]"
            git push
          fi

      - name: Archive reports
        run: uv run python3 crowdsourcing/archive_reports.py

      - name: Commit archive changes
        run: |
          git add docs/validation_reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: archive validation reports"
            git push
          fi
